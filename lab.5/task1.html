<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка возраста</title>
</head>
<body>

    <h2>Проверка возраста</h2>

    <input type="number" id="age" placeholder="Введите возраст">
    <button id="checkBtn">Проверить</button>

    <p id="result"></p>

    <script>
        document.getElementById("checkBtn").addEventListener("click", function () {
            const age = Number(document.getElementById("age").value);
            const result = document.getElementById("result");

            if (age < 0) {
                result.textContent = "Возраст не может быть отрицательным.";
            } else if (age < 14) {
                result.textContent = "Вы ребёнок.";
            } else if (age < 18) {
                result.textContent = "Вы подросток.";
            } else {
                result.textContent = "Вы совершеннолетний.";
            }
        });
    </script>

</body>
</html>
