<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список задач</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
        }

        .input-block {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            background: #f2f2f2;
        }

        li span {
            flex: 1;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete {
            background: #ff5555;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <h2>Список задач</h2>

    <div class="input-block">
        <input
            type="text"
            id="taskInput"
            placeholder="Введите задачу"
        >

        <button id="addBtn">Добавить</button>
    </div>

    <ul id="taskList"></ul>

    <hr>

    <p>
        Выполнено:
        <strong id="completedCount">0</strong>
    </p>

    <p>
        Не выполнено:
        <strong id="uncompletedCount">0</strong>
    </p>

    <script>
        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");

        const completedCount =
            document.getElementById("completedCount");

        const uncompletedCount =
            document.getElementById("uncompletedCount");


        // Добавление новой задачи
        addBtn.addEventListener("click", function () {

            const text = taskInput.value.trim();

            if (text === "") {
                alert("Введите задачу!");
                return;
            }

            // Создаём элемент списка
            const li = document.createElement("li");

            // Checkbox
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";

            // Текст задачи
            const span = document.createElement("span");
            span.textContent = text;

            // Кнопка удаления
            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Удалить";
            deleteBtn.className = "delete";

            // Отметка задачи выполненной
            checkbox.addEventListener("change", function () {

                span.classList.toggle(
                    "completed",
                    checkbox.checked
                );

                updateCounters();
            });

            // Удаление задачи
            deleteBtn.addEventListener("click", function () {

                li.remove();

                updateCounters();
            });

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(deleteBtn);

            taskList.appendChild(li);

            taskInput.value = "";

            updateCounters();
        });


        // Обновление счётчиков
        function updateCounters() {

            const tasks = taskList.querySelectorAll("li");

            let completed = 0;
            let uncompleted = 0;

            tasks.forEach(function (task) {

                const checkbox = task.querySelector(
                    "input[type='checkbox']"
                );

                if (checkbox.checked) {
                    completed++;
                } else {
                    uncompleted++;
                }
            });

            completedCount.textContent = completed;
            uncompletedCount.textContent = uncompleted;
        }


        // Добавление задачи клавишей Enter
        taskInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {
                addBtn.click();
            }

        });
    </script>

</body>
</html>
