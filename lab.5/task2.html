<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конвертер температуры</title>
</head>
<body>

    <h2>Конвертер температуры</h2>

    <input type="number" id="temperature" placeholder="Температура">

    <select id="from">
        <option value="C">Celsius</option>
        <option value="F">Fahrenheit</option>
        <option value="K">Kelvin</option>
    </select>

    <span> → </span>

    <select id="to">
        <option value="C">Celsius</option>
        <option value="F">Fahrenheit</option>
        <option value="K">Kelvin</option>
    </select>

    <button id="convertBtn">Конвертировать</button>

    <p id="result"></p>

    <script>
        document.getElementById("convertBtn").addEventListener("click", function () {
            const value = Number(document.getElementById("temperature").value);
            const from = document.getElementById("from").value;
            const to = document.getElementById("to").value;

            let celsius;

            // Сначала переводим в Celsius
            if (from === "C") {
                celsius = value;
            } else if (from === "F") {
                celsius = (value - 32) * 5 / 9;
            } else {
                celsius = value - 273.15;
            }

            let result;

            // Затем из Celsius в нужную шкалу
            if (to === "C") {
                result = celsius;
            } else if (to === "F") {
                result = celsius * 9 / 5 + 32;
            } else {
                result = celsius + 273.15;
            }

            document.getElementById("result").textContent =
                `Результат: ${result.toFixed(2)}°`;
        });
    </script>

</body>
</html>
